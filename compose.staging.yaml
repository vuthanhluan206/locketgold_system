# Zero-Conflict Staging Docker Compose (`compose.staging.yaml`)
# Designed to run safely in parallel on the Ubuntu VPS (103.118.29.159) WHILE the old
# `locket.gold` Caddy container is still occupying ports 80 and 443.
#
# Key Security & Isolation Properties:
# 1. Uses `.env.staging` (override via `STAGING_ENV_FILE`), NEVER `.env` production.
# 2. Enforces `APP_ENV=staging`, which refuses to boot if `MONGODB_DATABASE=locket_manager` (production).
# 3. Core Staging (`api`) binds strictly to loopback `127.0.0.1:18000:8000` (never exposed to Internet).
# 4. API mounts `./certs_public:/app/certs_public:ro` (read-only public CA; NEVER mounts `certs_private`)
#    and `./backups:/app/backups` (writable by UID 10001).
# 5. Optional HTTPS Research Lab (`lab_https`) runs under `--profile lab` on `127.0.0.1:18443:8443`,
#    mounting `./certs_private:/etc/caddy/certs:ro` after certificates are generated via one-shot `ca_init`.

services:
  api:
    build: .
    container_name: locket_staging_api
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    environment:
      - APP_ENV=staging
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backups:/app/backups
      - ./certs_public:/app/certs_public:ro
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  ca_init:
    build: .
    container_name: locket_staging_ca_init
    profiles:
      - ca_init
    user: "10001:10001"
    volumes:
      - ./certs_public:/app/certs_public
      - ./certs_private:/app/certs_private
    command:
      - python
      - -m
      - scripts.generate_lab_ca
      - --out-public
      - /app/certs_public
      - --out-private
      - /app/certs_private
      - --domains
      - locketgold.vuthanhluan.bond,mock.lab.vuthanhluan.bond,sub.lab.vuthanhluan.bond

  lab_https:
    image: caddy:2-alpine
    container_name: locket_staging_lab_https
    profiles:
      - lab
    ports:
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./Caddyfile.lab:/etc/caddy/Caddyfile:ro
      - ./certs_private:/etc/caddy/certs:ro
      - staging_lab_caddy_data:/data
      - staging_lab_caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  staging_lab_caddy_data:
  staging_lab_caddy_config:
