name: CI — Security, Parity & Staging Gate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Python Compile, Lint, Secret Scan & Pytest Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and ruff linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Verify no committed secrets, private keys, or forbidden files
        run: |
          python -m scripts.check_secrets

      - name: Python syntax & bytecode compile check
        run: |
          python -m py_compile app/*.py app/routers/*.py app/services/*.py scripts/*.py tests/*.py index.py

      - name: Ruff static analysis check (syntax & fatal errors)
        run: |
          ruff check app scripts tests --select E9,F63,F7,F82

      - name: Run full pytest suite (unit, device auth, real MongoDB integration, lookup, mobileconfig, PKI, rollback, staging isolation)
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          pytest -v

  docker-staging-gate:
    name: Docker Build, Compose Config & 20-Step Live Runtime E2E Smoke Suite
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for E2E harness
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies for E2E harness
        run: |
          pip install -r requirements.txt

      - name: Validate Docker Compose configurations (compose.yaml, compose.staging.yaml, compose.lab.yaml)
        run: |
          cp .env.example .env
          cp .env.staging.example .env.staging
          docker compose -f compose.yaml config > /dev/null
          docker compose -f compose.staging.yaml config > /dev/null
          docker compose -f compose.yaml -f compose.lab.yaml config > /dev/null
          rm -f .env .env.staging

      - name: Build production/staging Docker image and verify non-root UID 10001 & directory permissions
        run: |
          docker build -t locketgold-staging:ci .
          USER_ID=$(docker run --rm locketgold-staging:ci id -u)
          test "$USER_ID" = "10001"
          docker run --rm locketgold-staging:ci python -c "
          from pathlib import Path
          for d in ('/app/backups', '/app/certs_public', '/app/certs_private'):
              p = Path(d) / 'test_write'
              p.write_text('ok')
              p.unlink()
          "

      - name: Execute 20-Step Live Docker Runtime E2E Smoke Suite (FastAPI + MongoDB + Caddy HTTPS Lab)
        run: |
          python -m scripts.docker_e2e_smoke
