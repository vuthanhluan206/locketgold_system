name: CI — Security, Parity & Staging Gate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Python Compile, Lint, Secret Scan & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and ruff linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Verify no committed secrets, private keys, or forbidden files
        run: |
          python -m scripts.check_secrets

      - name: Python syntax & bytecode compile check
        run: |
          python -m py_compile app/*.py app/routers/*.py app/services/*.py scripts/*.py tests/*.py index.py

      - name: Ruff static analysis check (syntax & fatal errors)
        run: |
          ruff check app scripts tests --select E9,F63,F7,F82

      - name: Run full pytest suite (unit, device auth, DB consistency, lookup, mobileconfig, PKI, rollback)
        run: |
          pytest -v

  docker-staging-gate:
    name: Docker Build, Compose Config & Staging Smoke Gate
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configurations (compose.yaml, compose.staging.yaml, compose.lab.yaml)
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config > /dev/null
          docker compose -f compose.staging.yaml config > /dev/null
          docker compose -f compose.yaml -f compose.lab.yaml config > /dev/null

      - name: Build production/staging Docker image and verify non-root user
        run: |
          docker build -t locketgold-staging:ci .
          USER_ID=$(docker run --rm locketgold-staging:ci id -u)
          test "$USER_ID" = "10001"
