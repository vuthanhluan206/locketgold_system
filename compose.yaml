services:
  api:
    build: .
    container_name: locket_lab_api
    env_file:
      - .env
    environment:
      - ALLOW_LAB_CA_PROFILE=${ALLOW_LAB_CA_PROFILE:-true}
    expose:
      - "8000"
    volumes:
      - ./backups:/app/backups
      - ./certs_public:/app/certs_public:ro
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ca_init:
    build: .
    container_name: locket_lab_ca_init
    profiles:
      - ca_init
    user: "10001:10001"
    volumes:
      - ./certs_public:/app/certs_public
      - ./certs_private:/app/certs_private
    command:
      - python
      - -m
      - scripts.generate_lab_ca
      - --out-public
      - /app/certs_public
      - --out-private
      - /app/certs_private
      - --domains
      - locketgold.vuthanhluan.bond,mock.lab.vuthanhluan.bond,sub.lab.vuthanhluan.bond

  caddy:
    image: caddy:2-alpine
    container_name: locket_lab_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
